<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#eef5ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NovaPanel" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    window.BASE_URL = "{{ .BASE_URL }}"

    // Dev Mode
    if (window.BASE_URL.charAt(0) === '{') window.BASE_URL = "/app/"
  </script>
  <title>NovaPanel</title>
</head>

<body>
  <div id="app"></div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault()
        window.__NOVAPANEL_INSTALL_PROMPT__ = event
        window.dispatchEvent(new CustomEvent("novapanel-install-ready"))
      })
      window.addEventListener("appinstalled", function () {
        window.__NOVAPANEL_INSTALL_PROMPT__ = null
        window.dispatchEvent(new CustomEvent("novapanel-installed"))
      })
      window.addEventListener("load", function () {
        var manifest = document.querySelector('link[rel="manifest"]')
        var base = new URL("./", manifest ? manifest.href : window.location.href)
        navigator.serviceWorker.register(new URL("service-worker.js", base), {
          scope: base.pathname,
          updateViaCache: "none"
        }).catch(function (error) {
          console.warn("NovaPanel service worker registration failed:", error)
        })
      })
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
