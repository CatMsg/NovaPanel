name: 发布 NovaPanel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，留空则读取 config/version"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: novapanel-release
  cancel-in-progress: false

env:
  NODE_VERSION: "25"
  CRONET_GO_VERSION: "b3c2ed82ac97b79cd051f7ec59ccbd2e014bb6de"
  CRONET_GO_REPO: https://github.com/sagernet/cronet-go.git
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  test-frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 同步前端版本
        run: node ./scripts/sync-frontend-version.mjs

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 运行前端检查
        run: |
          cd frontend
          npm audit
          npm run test:unit
          npm run lint:check
          npm run typecheck

      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 浏览器 Smoke Test
        working-directory: frontend
        run: npm run test:e2e

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 同步前端版本
        run: node ./scripts/sync-frontend-version.mjs

      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build:assets

      - name: 上传前端构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  test-backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: true
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 检查脚本语法
        run: |
          sh -n entrypoint.sh
          bash -n install.sh novas.sh runNovas.sh build.sh scripts/*.sh
          bash ./scripts/check-github-action-pins.sh
          bash ./scripts/check-release-policy.sh

      - name: 运行静态检查
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: 运行 Go 测试
        run: bash ./scripts/go-test-packages.sh

      - name: Real Mihomo MASQUE Interoperability
        run: bash ./scripts/test-mihomo-masque.sh

  test-sing-box-race:
    name: Sing-Box 核心并发与协议回归
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: true
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Sing-Box Source And Core Race Regression
        run: bash ./scripts/test-sing-box-race.sh

  test-fresh-ufw-linux:
    name: Native fresh-UFW acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: true
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 构建原生验收用 novas
        run: go build -o "$RUNNER_TEMP/novas-fresh-ufw-test" .

      - name: 运行真实 UFW 与 SSH 验收
        env:
          NOVAS_FRESH_UFW_OPT_IN: "1"
          NOVAS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NOVAS_GITHUB_JOB: ${{ github.job }}
          NOVAS_GITHUB_WORKFLOW: ${{ github.workflow }}
          NOVAS_GITHUB_EVENT_NAME: ${{ github.event_name }}
          NOVAS_GITHUB_SERVER_URL: ${{ github.server_url }}
          NOVAS_GITHUB_REPOSITORY: ${{ github.repository }}
          NOVAS_GITHUB_RUN_ID: ${{ github.run_id }}
          NOVAS_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NOVAS_RUNNER_OS: ${{ runner.os }}
          NOVAS_RUNNER_NAME: ${{ runner.name }}
          NOVAS_RUNNER_TEMP: ${{ runner.temp }}
          NOVAS_WORKSPACE: ${{ github.workspace }}
        run: |
          sudo env \
            NOVAS_FRESH_UFW_OPT_IN="$NOVAS_FRESH_UFW_OPT_IN" \
            NOVAS_GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            NOVAS_RUNNER_ENVIRONMENT="$NOVAS_RUNNER_ENVIRONMENT" \
            NOVAS_GITHUB_JOB="$NOVAS_GITHUB_JOB" \
            NOVAS_GITHUB_WORKFLOW="$NOVAS_GITHUB_WORKFLOW" \
            NOVAS_GITHUB_EVENT_NAME="$NOVAS_GITHUB_EVENT_NAME" \
            NOVAS_GITHUB_SERVER_URL="$NOVAS_GITHUB_SERVER_URL" \
            NOVAS_GITHUB_REPOSITORY="$NOVAS_GITHUB_REPOSITORY" \
            NOVAS_GITHUB_RUN_ID="$NOVAS_GITHUB_RUN_ID" \
            NOVAS_GITHUB_RUN_ATTEMPT="$NOVAS_GITHUB_RUN_ATTEMPT" \
            NOVAS_RUNNER_OS="$NOVAS_RUNNER_OS" \
            NOVAS_RUNNER_NAME="$NOVAS_RUNNER_NAME" \
            NOVAS_RUNNER_TEMP="$NOVAS_RUNNER_TEMP" \
            NOVAS_WORKSPACE="$NOVAS_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/scripts/test-fresh-ufw-linux.sh" \
              "$RUNNER_TEMP/novas-fresh-ufw-test"

  test-acme-cron-linux:
    name: Native ACME/cron acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 运行真实 ACME cron 验收
        env:
          NOVAS_ACME_CRON_OPT_IN: "1"
          NOVAS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NOVAS_GITHUB_JOB: ${{ github.job }}
          NOVAS_GITHUB_WORKFLOW: ${{ github.workflow }}
          NOVAS_GITHUB_EVENT_NAME: ${{ github.event_name }}
          NOVAS_GITHUB_SERVER_URL: ${{ github.server_url }}
          NOVAS_GITHUB_REPOSITORY: ${{ github.repository }}
          NOVAS_GITHUB_RUN_ID: ${{ github.run_id }}
          NOVAS_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NOVAS_RUNNER_OS: ${{ runner.os }}
          NOVAS_RUNNER_NAME: ${{ runner.name }}
          NOVAS_RUNNER_TEMP: ${{ runner.temp }}
          NOVAS_WORKSPACE: ${{ github.workspace }}
        run: |
          sudo env \
            NOVAS_ACME_CRON_OPT_IN="$NOVAS_ACME_CRON_OPT_IN" \
            NOVAS_GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            NOVAS_RUNNER_ENVIRONMENT="$NOVAS_RUNNER_ENVIRONMENT" \
            NOVAS_GITHUB_JOB="$NOVAS_GITHUB_JOB" \
            NOVAS_GITHUB_WORKFLOW="$NOVAS_GITHUB_WORKFLOW" \
            NOVAS_GITHUB_EVENT_NAME="$NOVAS_GITHUB_EVENT_NAME" \
            NOVAS_GITHUB_SERVER_URL="$NOVAS_GITHUB_SERVER_URL" \
            NOVAS_GITHUB_REPOSITORY="$NOVAS_GITHUB_REPOSITORY" \
            NOVAS_GITHUB_RUN_ID="$NOVAS_GITHUB_RUN_ID" \
            NOVAS_GITHUB_RUN_ATTEMPT="$NOVAS_GITHUB_RUN_ATTEMPT" \
            NOVAS_RUNNER_OS="$NOVAS_RUNNER_OS" \
            NOVAS_RUNNER_NAME="$NOVAS_RUNNER_NAME" \
            NOVAS_RUNNER_TEMP="$NOVAS_RUNNER_TEMP" \
            NOVAS_WORKSPACE="$NOVAS_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/scripts/test-acme-cron-linux.sh"

  test-windows-installer-prereqs:
    name: Windows installer source and dependency checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: WinSW 摘要与安装器行为回归测试
        shell: pwsh
        run: ./windows/test-winsw-verifier.ps1

  build-linux:
    name: 构建-${{ matrix.platform }}
    needs:
      - build-frontend
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            arch: amd64
            file_arch: x86-64
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 下载前端构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: web/html

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: true
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 克隆 cronet-go
        run: |
          set -e
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin ${{ env.CRONET_GO_REPO }}
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "${{ env.CRONET_GO_VERSION }}"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: 重新生成 Debian keyring（cronet sysroot）
        run: |
          set -e
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: 构建 cronet 库并设置工具链环境
        run: |
          set -euo pipefail
          cd ~/cronet-go
          retry_cmd() {
            local attempt=1
            local max_attempts=6
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "命令失败，$attempt/$max_attempts 次，20 秒后重试: $*"
              attempt=$((attempt + 1))
              sleep 20
            done
          }
          retry_cmd go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          retry_cmd go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            [[ -z "$line" ]] && continue
            echo "$line" >> $GITHUB_ENV
          done

      - name: 设置 Go 构建环境
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: 构建 NovaPanel
        run: |
          set -e
          BUILD_TAGS="with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale,with_naive_outbound,with_musl"
          go build -ldflags="-w -s -checklinkname=0 -linkmode external -extldflags '-static'" -tags "$BUILD_TAGS" -o novas .
          file novas
          ldd novas 2>/dev/null || echo "已确认静态二进制文件"

          mkdir -p release/novas/bin release/novas/scripts
          cp novas novas.service novas.sh LICENSE THIRD_PARTY_NOTICES.md release/novas/
          mkdir -p release/novas/licenses
          cp third_party/sing-box/LICENSE release/novas/licenses/sing-box-LICENSE
          cp scripts/hy2-forward.sh scripts/login-guard.sh scripts/install-runtime.sh release/novas/scripts/

      - name: 构建 Mieru 服务端
        run: |
          set -e
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} bash ./scripts/build-mita.sh release/novas/bin/mita
          chmod 755 release/novas/bin/mita

      - name: 验证 Linux 二进制
        run: |
          set -euo pipefail
          bash ./scripts/verify-linux-release-binaries.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.file_arch }}" \
            ./novas \
            ./release/novas/bin/mita
          release/novas/bin/mita version
          CC=gcc CGO_CFLAGS= CGO_LDFLAGS= NOVAS_TEST_BINARY="$PWD/novas" go test ./cmd -run TestRuntimeBinarySmoke -count=1

      - name: 打包
        run: |
          set -e
          tar -zcvf NovaPanel-linux-${{ matrix.platform }}.tar.gz -C release novas
          sha256sum NovaPanel-linux-${{ matrix.platform }}.tar.gz > NovaPanel-linux-${{ matrix.platform }}.tar.gz.sha256
          sha256sum --check NovaPanel-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: 生成构建来源证明
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: NovaPanel-linux-${{ matrix.platform }}.tar.gz

      - name: 保存离线验证 bundle
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE_PATH"
          cp -- "$ATTESTATION_BUNDLE_PATH" "NovaPanel-linux-${PLATFORM}.tar.gz.sigstore.json"

      - name: 生成安装脚本来源证明
        id: install-script-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: install.sh

      - name: 生成管理脚本来源证明
        id: manager-script-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: novas.sh

      - name: 保存脚本来源证明 bundles
        env:
          INSTALL_BUNDLE_PATH: ${{ steps.install-script-attestation.outputs.bundle-path }}
          MANAGER_BUNDLE_PATH: ${{ steps.manager-script-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$INSTALL_BUNDLE_PATH"
          test -s "$MANAGER_BUNDLE_PATH"
          cp -- "$INSTALL_BUNDLE_PATH" NovaPanel-install.sh.sigstore.json
          cp -- "$MANAGER_BUNDLE_PATH" NovaPanel-novas.sh.sigstore.json

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NovaPanel-linux-${{ matrix.platform }}
          path: |
            ./NovaPanel-linux-${{ matrix.platform }}.tar.gz*
            ./NovaPanel-install.sh.sigstore.json
            ./NovaPanel-novas.sh.sigstore.json
          retention-days: 1

  publish-release:
    name: 发布 Release 产物
    needs:
      - build-linux
      - test-frontend
      - test-backend
      - test-sing-box-race
      - test-fresh-ufw-linux
      - test-acme-cron-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 规范化发布标签
        id: vars
        env:
          TAG_INPUT: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < config/version)"
          bash ./scripts/prepare-release-tag.sh "$TAG_INPUT" "$VERSION" "$GITHUB_REF" "$GITHUB_SHA"

      - name: 下载构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NovaPanel-*
          path: release-assets
          merge-multiple: true

      - name: 验证构建来源证明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release-assets/NovaPanel-linux-*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "没有找到待验证的 Linux 发布包" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            bundle="${archive}.sigstore.json"
            if [[ ! -s "$bundle" ]]; then
              echo "没有找到发布包来源证明 bundle: $bundle" >&2
              exit 1
            fi
            verified=0
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" \
                --repo "$GITHUB_REPOSITORY" \
                --bundle "$bundle" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners; then
                verified=1
                break
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep $((attempt * 5))
              fi
            done
            [[ "$verified" -eq 1 ]] || {
              echo "构建来源证明验证失败: $archive" >&2
              exit 1
            }
          done
          for source in install.sh novas.sh; do
            bundle="release-assets/NovaPanel-${source}.sigstore.json"
            if [[ ! -s "$bundle" ]]; then
              echo "没有找到脚本来源证明 bundle: $bundle" >&2
              exit 1
            fi
            gh attestation verify "$source" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: 准备 Release 说明
        id: body
        run: |
          set -e
          BODY_PATH=".github/release-notes/${{ steps.vars.outputs.tag }}.md"
          if [ ! -f "$BODY_PATH" ]; then
            echo "未找到 $BODY_PATH，使用临时说明文件"
            BODY_PATH="$(mktemp)"
            printf '# NovaPanel %s\n\n' "${{ steps.vars.outputs.tag }}" > "$BODY_PATH"
          fi
          echo "body_path=$BODY_PATH" >> "$GITHUB_OUTPUT"

      - name: 创建 Draft Release
        if: steps.vars.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          BODY_PATH: ${{ steps.body.outputs.body_path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NovaPanel $TAG" \
            --notes-file "$BODY_PATH" \
            --draft

      - name: 上传 Release 资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "release-assets 中没有可上传文件" >&2
            exit 1
          fi

          max_attempts=5
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            expected_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            uploaded_asset=0
            for attempt in $(seq 1 "$max_attempts"); do
              if gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"; then
                uploaded_asset=1
                break
              fi

              # The upload may have succeeded even if the client lost its response.
              if release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)"; then
                uploaded_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release_json")"
                if [[ -n "$uploaded_digest" ]]; then
                  if [[ "$uploaded_digest" != "$expected_digest" ]]; then
                    echo "Release asset digest mismatch for $name: $uploaded_digest" >&2
                    exit 1
                  fi
                  uploaded_asset=1
                  break
                fi
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((attempt * 15))
                echo "Release 资产上传失败（$attempt/$max_attempts），${delay} 秒后重试: $name"
                sleep "$delay"
              fi
            done
            if [ "$uploaded_asset" -ne 1 ]; then
              echo "Release 资产上传连续失败 $max_attempts 次: $name" >&2
              exit 1
            fi
          done

          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            expected_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            actual_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release_json")"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "Release 缺少资产或 SHA-256 不匹配: $name" >&2
              exit 1
            fi
          done

      - name: 发布已验证的 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          [[ "$draft" == "false" ]] || { echo "Release still marked as draft" >&2; exit 1; }

  cleanup-failed-runs:
    name: 清理失败的旧 Run
    needs:
      - publish-release
    if: ${{ needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 删除同提交失败的旧 Run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: release.yml
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          runs=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[]
              | select(.head_sha == env.CURRENT_SHA and .conclusion != "success" and (.id | tostring) != env.CURRENT_RUN_ID)
              | .id')

          if [ -z "$runs" ]; then
            echo "没有需要清理的失败 Run"
            exit 0
          fi

          for run_id in $runs; do
            echo "删除失败的 workflow run: $run_id"
            gh api -X DELETE "repos/$REPO/actions/runs/$run_id"
          done
