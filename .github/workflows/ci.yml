name: NovaPanel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "25"

jobs:
  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 同步前端版本
        run: node ./scripts/sync-frontend-version.mjs

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 依赖安全检查
        working-directory: frontend
        run: npm audit

      - name: 前端单元测试
        working-directory: frontend
        run: npm run test:unit

      - name: ESLint 检查
        working-directory: frontend
        run: npm run lint:check

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 构建前端
        working-directory: frontend
        run: npm run build:assets

      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 浏览器 Smoke Test
        working-directory: frontend
        run: npm run test:e2e

  backend:
    name: 后端检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: false
          go-version-file: go.mod

      - name: 检查脚本语法
        run: |
          sh -n entrypoint.sh
          bash -n install.sh novas.sh runNovas.sh build.sh scripts/*.sh
          bash ./scripts/check-github-action-pins.sh
          bash ./scripts/check-release-policy.sh

      - name: Go 格式检查
        run: |
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do
            if [ -f "$file" ]; then
              gofmt -l "$file"
            fi
          done)"
          if [ -n "$unformatted" ]; then
            echo "以下 Go 文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: 漏洞检查
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: 运行 Go 测试
        run: bash ./scripts/go-test-packages.sh

      - name: Verify Sing-Box Source And Core Race Regression
        run: bash ./scripts/test-sing-box-race.sh

      - name: Real Mihomo MASQUE Interoperability
        run: bash ./scripts/test-mihomo-masque.sh

      - name: 基础 Go 构建
        run: go build ./...

  windows-installer-prereqs:
    name: Windows installer source and dependency checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: WinSW 摘要与安装器行为回归测试
        shell: pwsh
        run: ./windows/test-winsw-verifier.ps1

  docker:
    name: Docker 构建
    needs:
      - frontend
      - backend
      - windows-installer-prereqs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: 构建 AMD64 镜像
        run: docker build --platform linux/amd64 -t novapanel-ci .
